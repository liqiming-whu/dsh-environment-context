- insert:
    - id: environment-context
      name: dsh-environment-context
      config:
        enabled: true
        locale: zh-CN
        injectTime: true
        injectTimezone: true
        injectWeekday: true
        injectWeather: true
        showLocation: true
        showCondition: true
        showTemperature: true
        showFeelsLike: true
        showHumidity: true
        showWind: true
        weatherProvider: open-meteo
        locationMode: manual
        reverseGeocodingProvider: auto
        manualLocation: 武汉
        weatherRefreshMinutes: 30
        locationRefreshMinutes: 10
        injectBattery: true
        showCharging: true
        injectDevice: true
        showDeviceName: true
        showDeviceModel: true
        showDevicePlatform: true
        customDeviceName: ''
        sectionOrder: 20
